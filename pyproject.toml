[project]
name = "ha-vivino-cellar"
version = "0.1.0"
description = "Vivino Cellar integration for Home Assistant"
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = [
    "aiohttp>=3.14.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP", "RUF", "DTZ"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["DTZ"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
